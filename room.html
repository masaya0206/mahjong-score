<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>対局 | Mahjong Score</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar room-topbar">
    <a class="text-link" href="./index.html">← ホーム</a>
    <div class="center-head">
      <p id="roundLabel" class="kicker">WAITING</p>
      <h1 id="roomTitle">卓</h1>
    </div>
    <span id="liveBadge" class="live-badge">● LIVE</span>
  </header>

  <main class="shell stack">
    <section id="waitingCard" class="card hidden">
      <div class="split-head">
        <div>
          <p class="kicker">ROOM CODE</p>
          <div id="roomCodeDisplay" class="room-code">------</div>
        </div>
        <button id="copyInviteBtn" class="small-btn" type="button">招待リンクをコピー</button>
      </div>
      <div class="qr-wrap">
        <canvas id="qrCanvas" width="180" height="180" aria-label="招待QRコード"></canvas>
        <p class="muted">QRまたは卓コードで参加できます。</p>
      </div>
      <div id="waitingMembers" class="list"></div>
      <button id="startGameBtn" class="primary-btn hidden" type="button">4人で対局開始</button>
    </section>

    <section id="gameSection" class="hidden">
      <section class="table-board" aria-label="麻雀卓の席配置">
        <div id="scoreBoard" class="table-seats"></div>
        <div class="table-center" aria-live="polite">
          <span class="table-center-label">CURRENT</span>
          <strong id="roundMini">東1</strong>
          <div class="table-center-meta">
            <span>本場 <b id="honbaLabel">0</b></span>
            <span>供託 <b id="riichiLabel">0</b></span>
          </div>
        </div>
      </section>

      <section id="hostControls" class="card hidden">
        <div class="split-head">
          <div>
            <p class="kicker">HOST CONTROL</p>
            <h2>対局操作</h2>
          </div>
          <button id="undoBtn" class="small-btn" type="button">↶ 1手戻す</button>
        </div>

        <div class="tabs" role="group" aria-label="操作種別">
          <button class="tab active" data-panel="ron" type="button">ロン</button>
          <button class="tab" data-panel="tsumo" type="button">ツモ</button>
          <button class="tab" data-panel="riichi" type="button">リーチ</button>
          <button class="tab" data-panel="manual" type="button">手動</button>
        </div>

        <div id="panel-ron" class="op-panel">
          <div class="two-col">
            <label class="field"><span>和了者</span><select id="ronWinner"></select></label>
            <label class="field"><span>放銃者</span><select id="ronLoser"></select></label>
          </div>
          <div class="two-col">
            <label class="field">
              <span>翻数</span>
              <select id="ronHan">
                <option value="1">1翻</option><option value="2">2翻</option>
                <option value="3">3翻</option><option value="4">4翻</option>
                <option value="5">5翻（満貫）</option><option value="6">6翻</option>
                <option value="7">7翻</option><option value="8">8翻</option>
                <option value="9">9翻</option><option value="10">10翻</option>
                <option value="11">11翻</option><option value="12">12翻</option>
                <option value="13">13翻以上（役満）</option>
              </select>
            </label>
            <label class="field">
              <span>符</span>
              <select id="ronFu">
                <option value="20">20符</option><option value="25">25符</option>
                <option value="30" selected>30符</option><option value="40">40符</option>
                <option value="50">50符</option><option value="60">60符</option>
                <option value="70">70符</option><option value="80">80符</option>
                <option value="90">90符</option><option value="100">100符</option>
                <option value="110">110符</option>
              </select>
            </label>
          </div>
          <p id="ronPreview" class="muted">点数：-</p>
          <label class="check"><input id="ronRenchan" type="checkbox"> 親連荘</label>
          <button id="ronBtn" class="primary-btn" type="button">ロン確定</button>
        </div>

        <div id="panel-tsumo" class="op-panel hidden">
          <label class="field"><span>和了者</span><select id="tsumoWinner"></select></label>
          <div class="two-col">
            <label class="field">
              <span>翻数</span>
              <select id="tsumoHan">
                <option value="1">1翻</option><option value="2">2翻</option>
                <option value="3">3翻</option><option value="4">4翻</option>
                <option value="5">5翻（満貫）</option><option value="6">6翻</option>
                <option value="7">7翻</option><option value="8">8翻</option>
                <option value="9">9翻</option><option value="10">10翻</option>
                <option value="11">11翻</option><option value="12">12翻</option>
                <option value="13">13翻以上（役満）</option>
              </select>
            </label>
            <label class="field">
              <span>符</span>
              <select id="tsumoFu">
                <option value="20">20符</option><option value="25">25符</option>
                <option value="30" selected>30符</option><option value="40">40符</option>
                <option value="50">50符</option><option value="60">60符</option>
                <option value="70">70符</option><option value="80">80符</option>
                <option value="90">90符</option><option value="100">100符</option>
                <option value="110">110符</option>
              </select>
            </label>
          </div>
          <p id="tsumoPreview" class="muted">支払い：-</p>
          <label class="check"><input id="tsumoRenchan" type="checkbox"> 親連荘</label>
          <button id="tsumoBtn" class="primary-btn" type="button">ツモ確定</button>
        </div>

        <div id="panel-riichi" class="op-panel hidden">
          <label class="field"><span>リーチする人</span><select id="riichiPlayer"></select></label>
          <div id="riichiStatusBox" class="riichi-confirm-box">
            <div>
              <span class="mini-label">点数</span>
              <strong id="riichiScorePreview">-</strong>
            </div>
            <div>
              <span class="mini-label">供託</span>
              <strong id="riichiPotPreview">-</strong>
            </div>
          </div>
          <p id="riichiHelp" class="muted">同じ局では1人1回だけリーチできます。</p>
          <button id="riichiBtn" class="primary-btn" type="button">リーチを確定</button>
        </div>

        <div id="panel-manual" class="op-panel hidden">
          <div class="two-col">
            <label class="field"><span>支払う人</span><select id="manualFrom"></select></label>
            <label class="field"><span>受け取る人</span><select id="manualTo"></select></label>
          </div>
          <label class="field"><span>点数</span><input id="manualPoints" type="number" min="100" step="100" inputmode="numeric" placeholder="例：1000"></label>
          <button id="manualBtn" class="secondary-btn" type="button">点数移動</button>
        </div>

        <div class="divider"></div>

        <div class="action-grid">
          <button id="drawRenchanBtn" class="secondary-btn" type="button">流局・親連荘</button>
          <button id="drawNextBtn" class="secondary-btn" type="button">流局・親流れ</button>
          <button id="nextRoundBtn" class="secondary-btn" type="button">手動で次局</button>
          <button id="finishBtn" class="danger-btn" type="button">半荘終了</button>
        </div>
        <p id="roomMessage" class="message" aria-live="polite"></p>
      </section>

      <section class="card">
        <p class="kicker">EVENT LOG</p>
        <h2>直近の操作</h2>
        <div id="eventLog" class="list"></div>
      </section>
    </section>

    <section id="finishedCard" class="card hidden">
      <p class="kicker">FINISHED</p>
      <h2>この半荘は終了しました</h2>
      <div id="finalRanking" class="list"></div>
      <a class="primary-btn link-btn" href="./history.html">戦績を見る</a>
    </section>
  </main>

  <script type="module" src="./room.js"></script>
</body>
</html>
