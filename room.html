<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>対局 | Mahjong Score</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header id="pageHeader" class="topbar room-topbar">
    <a class="text-link" href="./index.html">← ホーム</a>
    <div class="center-head">
      <p id="roundLabel" class="kicker">WAITING</p>
      <h1 id="roomTitle">卓</h1>
    </div>
    <span class="live-badge">● LIVE</span>
  </header>

  <main id="mainShell" class="shell stack">
    <section id="waitingCard" class="card hidden">
      <div class="split-head">
        <div>
          <p class="kicker">ROOM CODE</p>
          <div id="roomCodeDisplay" class="room-code">------</div>
        </div>
        <button id="copyInviteBtn" class="small-btn" type="button">招待リンクをコピー</button>
      </div>
      <div class="qr-wrap">
        <canvas id="qrCanvas" width="180" height="180" aria-label="招待QRコード"></canvas>
        <p class="muted">QRまたは卓コードで参加できます。</p>
      </div>
      <div id="waitingMembers" class="list"></div>
      <button id="startGameBtn" class="primary-btn hidden" type="button">4人で対局開始</button>
    </section>

    <section id="gameSection" class="game-screen hidden">
      <section class="table-board" aria-label="麻雀卓">
        <div id="scoreBoard" class="table-seats"></div>

        <button id="centerButton" class="table-center" type="button" aria-label="局情報とその他操作">
          <span class="table-center-label">CURRENT</span>
          <strong id="roundMini">東1</strong>
          <div class="table-center-meta">
            <span>本場 <b id="honbaLabel">0</b></span>
            <span>供託 <b id="riichiLabel">0</b></span>
          </div>
          <small>タップで操作</small>
        </button>

        <div id="roomToast" class="table-toast hidden" aria-live="polite"></div>
      </section>
    </section>

    <section id="nextGameCard" class="card hidden">
      <p class="kicker">NEXT GAME</p>
      <h2 id="nextGameTitle">次の半荘</h2>
      <p id="nextGameMessage" class="muted"></p>
      <div id="sessionSummary" class="list"></div>

      <div id="seatDecisionArea" class="hidden">
        <div class="divider"></div>
        <p class="kicker">SEAT DECISION</p>
        <h2>親が一周しました</h2>
        <div class="action-grid">
          <button id="keepSeatsBtn" class="secondary-btn" type="button">この席のまま続ける</button>
          <button id="shuffleSeatsBtn" class="secondary-btn" type="button">席替えして続ける</button>
        </div>
        <button id="endSessionBtn" class="danger-btn wide-btn" type="button">今日の対局を終了</button>
      </div>

      <div id="shuffleResultArea" class="hidden">
        <div class="divider"></div>
        <p class="kicker">SHUFFLED SEATS</p>
        <h2>席替え結果</h2>
        <div id="shuffleResult" class="list"></div>
        <div class="action-grid">
          <button id="reshuffleBtn" class="secondary-btn" type="button">もう一度シャッフル</button>
          <button id="confirmShuffleBtn" class="primary-btn no-top-margin" type="button">この席順で開始</button>
        </div>
      </div>

      <button id="startNextGameBtn" class="primary-btn hidden" type="button">次の半荘を開始</button>
    </section>

    <section id="finishedCard" class="card hidden">
      <p class="kicker">FINISHED</p>
      <h2>今日の対局を終了しました</h2>
      <div id="finalRanking" class="list"></div>
      <a class="primary-btn link-btn" href="./history.html">戦績を見る</a>
    </section>
  </main>

  <!-- リーチ確認 -->
  <dialog id="riichiDialog" class="app-dialog">
    <form method="dialog" class="dialog-panel">
      <div class="dialog-head">
        <div><p class="kicker">RIICHI</p><h2 id="riichiDialogTitle">リーチ</h2></div>
        <button class="icon-btn" value="cancel" aria-label="閉じる">×</button>
      </div>
      <div class="confirm-grid">
        <div><span>点数</span><strong id="riichiScoreText">-</strong></div>
        <div><span>供託</span><strong id="riichiPotText">-</strong></div>
      </div>
      <p id="riichiDialogHelp" class="muted"></p>
      <button id="confirmRiichiBtn" class="primary-btn" type="button">リーチを確定</button>
    </form>
  </dialog>

  <!-- 和了 -->
  <dialog id="winDialog" class="app-dialog">
    <div class="dialog-panel">
      <div class="dialog-head">
        <div><p class="kicker">AGARI</p><h2 id="winDialogTitle">和了</h2></div>
        <button id="closeWinBtn" class="icon-btn" type="button" aria-label="閉じる">×</button>
      </div>

      <div class="mode-switch">
        <button id="modeRonBtn" class="mode-btn active" type="button">ロン</button>
        <button id="modeTsumoBtn" class="mode-btn" type="button">ツモ</button>
      </div>

      <div class="two-col">
        <label class="field">
          <span>翻数</span>
          <select id="winHan">
            <option value="1">1翻</option><option value="2">2翻</option>
            <option value="3" selected>3翻</option><option value="4">4翻</option>
            <option value="5">5翻（満貫）</option><option value="6">6翻</option>
            <option value="7">7翻</option><option value="8">8翻</option>
            <option value="9">9翻</option><option value="10">10翻</option>
            <option value="11">11翻</option><option value="12">12翻</option>
            <option value="13">13翻以上（役満）</option>
          </select>
        </label>
        <label class="field">
          <span>符</span>
          <select id="winFu">
            <option value="20">20符</option><option value="25">25符</option>
            <option value="30" selected>30符</option><option value="40">40符</option>
            <option value="50">50符</option><option value="60">60符</option>
            <option value="70">70符</option><option value="80">80符</option>
            <option value="90">90符</option><option value="100">100符</option>
            <option value="110">110符</option>
          </select>
        </label>
      </div>

      <div id="loserArea">
        <p class="dialog-label">放銃者</p>
        <div id="loserButtons" class="player-choice-grid"></div>
      </div>

      <div id="winPreview" class="result-preview">点数：-</div>
      <button id="confirmWinBtn" class="primary-btn" type="button">確定</button>
    </div>
  </dialog>

  <!-- 中央その他操作 -->
  <dialog id="utilityDialog" class="app-dialog">
    <div class="dialog-panel">
      <div class="dialog-head">
        <div><p class="kicker">TABLE MENU</p><h2>その他操作</h2></div>
        <button id="closeUtilityBtn" class="icon-btn" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="utility-grid">
        <button id="drawRenchanBtn" class="utility-btn" type="button">流局<br><small>親連荘</small></button>
        <button id="drawNextBtn" class="utility-btn" type="button">流局<br><small>親流れ</small></button>
        <button id="chomboBtn" class="utility-btn danger-lite" type="button">チョンボ</button>
        <button id="manualBtn" class="utility-btn" type="button">点数修正</button>
        <button id="historyBtn" class="utility-btn" type="button">操作履歴</button>
        <button id="undoBtn" class="utility-btn" type="button">1手戻す</button>
      </div>
      <button id="finishBtn" class="danger-btn wide-btn host-only hidden" type="button">半荘を終了</button>
    </div>
  </dialog>

  <!-- チョンボ -->
  <dialog id="chomboDialog" class="app-dialog">
    <div class="dialog-panel">
      <div class="dialog-head">
        <div><p class="kicker">CHOMBO</p><h2>チョンボ</h2></div>
        <button id="closeChomboBtn" class="icon-btn" type="button">×</button>
      </div>
      <label class="field"><span>チョンボした人</span><select id="chomboPlayer"></select></label>
      <label class="field">
        <span>支払い方式</span>
        <select id="chomboMode">
          <option value="mangan" selected>満貫払い</option>
          <option value="manual">手動指定</option>
        </select>
      </label>
      <label id="chomboManualField" class="field hidden">
        <span>合計支払い点</span>
        <input id="chomboManualPoints" type="number" min="100" step="100" inputmode="numeric" placeholder="例：8000">
      </label>
      <p id="chomboPreview" class="result-preview">-</p>
      <button id="confirmChomboBtn" class="primary-btn" type="button">チョンボを確定</button>
    </div>
  </dialog>

  <!-- 手動点数修正 -->
  <dialog id="manualDialog" class="app-dialog">
    <div class="dialog-panel">
      <div class="dialog-head">
        <div><p class="kicker">ADJUST</p><h2>点数修正</h2></div>
        <button id="closeManualBtn" class="icon-btn" type="button">×</button>
      </div>
      <div class="two-col">
        <label class="field"><span>支払う人</span><select id="manualFrom"></select></label>
        <label class="field"><span>受け取る人</span><select id="manualTo"></select></label>
      </div>
      <label class="field"><span>点数</span><input id="manualPoints" type="number" min="100" step="100" inputmode="numeric" placeholder="例：1000"></label>
      <button id="confirmManualBtn" class="primary-btn" type="button">修正を確定</button>
    </div>
  </dialog>

  <!-- 履歴 -->
  <dialog id="historyDialog" class="app-dialog">
    <div class="dialog-panel">
      <div class="dialog-head">
        <div><p class="kicker">EVENT LOG</p><h2>操作履歴</h2></div>
        <button id="closeHistoryBtn" class="icon-btn" type="button">×</button>
      </div>
      <div id="eventLog" class="list"></div>
    </div>
  </dialog>

  <!-- 長押し順位条件 -->
  <dialog id="assistDialog" class="app-dialog">
    <div class="dialog-panel">
      <div class="dialog-head">
        <div><p class="kicker">RANK ASSIST</p><h2 id="assistTitle">点差・逆転条件</h2></div>
        <button id="closeAssistBtn" class="icon-btn" type="button">×</button>
      </div>
      <div id="assistContent"></div>
    </div>
  </dialog>

  <script type="module" src="./room.js"></script>
</body>
</html>
