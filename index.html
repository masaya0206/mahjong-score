<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Mahjong Score</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="kicker">REAL MAHJONG</p>
      <h1>麻雀スコア</h1>
    </div>
    <a class="text-link" href="./history.html">戦績</a>
  </header>

  <main class="shell stack">
    <section class="hero-card">
      <p class="kicker">SHARED TABLE</p>
      <h2>みんなのスマホで、同じ卓を見る。</h2>
      <p class="muted">親・局・本場・供託・4人の点数をSupabase Realtimeで同期します。</p>
    </section>

    <section class="card">
      <p class="kicker">HOST</p>
      <h2>新しい卓を作る</h2>
      <label class="field">
        <span>あなたの名前</span>
        <input id="createName" maxlength="20" placeholder="例：まさや" autocomplete="name">
      </label>
      <label class="field">
        <span>開始持ち点</span>
        <select id="startingPoints">
          <option value="25000" selected>25,000点</option>
          <option value="30000">30,000点</option>
        </select>
      </label>
      <button id="createRoomBtn" class="primary-btn" type="button">卓を作る</button>
    </section>

    <section class="card">
      <p class="kicker">JOIN</p>
      <h2>卓に参加する</h2>
      <label class="field">
        <span>卓コード</span>
        <input id="roomCode" maxlength="6" inputmode="text" autocapitalize="characters" placeholder="例：7K3M2Q">
      </label>
      <label class="field">
        <span>あなたの名前</span>
        <input id="joinName" maxlength="20" placeholder="例：大和" autocomplete="name">
      </label>
      <button id="joinRoomBtn" class="secondary-btn" type="button">参加する</button>
      <button id="scanQrBtn" class="qr-btn" type="button">QRで参加</button>
      <p id="homeMessage" class="message" aria-live="polite"></p>
    </section>

    <section class="card">
      <p class="kicker">RESUME</p>
      <h2>この端末の最近の卓</h2>
      <div id="recentRooms" class="list"></div>
    </section>
  </main>


  <dialog id="qrDialog" class="app-dialog">
    <div class="dialog-panel">
      <div class="dialog-head">
        <div><p class="kicker">QR JOIN</p><h2>QRコードを読み取る</h2></div>
        <button id="closeQrBtn" class="icon-btn" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="qr-scanner-box">
        <video id="qrVideo" playsinline muted></video>
        <div class="qr-guide" aria-hidden="true"></div>
      </div>
      <p id="qrStatus" class="muted">カメラをQRコードへ向けてください。</p>
      <input id="qrImageInput" class="hidden" type="file" accept="image/*">
      <button id="pickQrImageBtn" class="secondary-btn" type="button">写真からQRを読み取る</button>
    </div>
  </dialog>

  <script type="module" src="./index.js"></script>
</body>
</html>
