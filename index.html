<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Mahjong Score</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="kicker">REAL MAHJONG</p>
      <h1>麻雀スコア</h1>
    </div>
    <a class="text-link" href="./history.html">戦績</a>
  </header>

  <main class="shell stack">
    <section id="accountCard" class="card">
      <div id="loggedOutArea">
        <p class="kicker">ACCOUNT</p>
        <h2>ログイン / 初回登録</h2>

        <div class="mode-switch account-switch">
          <button id="showLoginBtn" class="mode-btn active" type="button">ログイン</button>
          <button id="showSignupBtn" class="mode-btn" type="button">初回登録</button>
        </div>

        <div id="loginArea">
          <label class="field"><span>メールアドレス</span><input id="loginEmail" type="email" autocomplete="email"></label>
          <label class="field"><span>パスワード</span><input id="loginPassword" type="password" autocomplete="current-password"></label>
          <button id="loginBtn" class="primary-btn" type="button">ログイン</button>
        </div>

        <div id="signupArea" class="hidden">
          <label class="field"><span>表示名</span><input id="signupName" maxlength="20" autocomplete="name" placeholder="例：まさや"></label>
          <label class="field"><span>メールアドレス</span><input id="signupEmail" type="email" autocomplete="email"></label>
          <label class="field"><span>パスワード</span><input id="signupPassword" type="password" minlength="6" autocomplete="new-password"></label>
          <button id="signupBtn" class="primary-btn" type="button">アカウントを作成</button>
        </div>
        <p id="authMessage" class="message" aria-live="polite"></p>
      </div>

      <div id="loggedInArea" class="hidden">
        <div class="split-head">
          <div>
            <p class="kicker">MY ACCOUNT</p>
            <h2 id="myDisplayName">-</h2>
            <p id="myEmail" class="muted"></p>
          </div>
          <button id="logoutBtn" class="small-btn" type="button">ログアウト</button>
        </div>
        <div id="myStats" class="account-stats"></div>
      </div>
    </section>

    <section id="inviteCard" class="card hidden">
      <p class="kicker">INVITATION</p>
      <h2>招待された卓</h2>
      <p id="inviteText" class="muted"></p>
      <button id="openInviteBtn" class="primary-btn" type="button">この卓を開く</button>
    </section>

    <section id="createCard" class="card hidden">
      <div class="split-head">
        <div>
          <p class="kicker">NEW TABLE</p>
          <h2>4人を選んで卓を作る</h2>
        </div>
        <span id="selectedCount" class="selection-pill">0 / 4</span>
      </div>

      <label class="field"><span>メンバー検索</span><input id="createSearch" type="search" placeholder="名前で検索"></label>
      <div id="createMemberList" class="account-member-list"></div>

      <label class="field">
        <span>開始持ち点</span>
        <select id="startingPoints">
          <option value="25000" selected>25,000点</option>
          <option value="30000">30,000点</option>
        </select>
      </label>

      <div class="action-grid">
        <button id="shuffleSelectionBtn" class="secondary-btn no-top-margin" type="button">席順をシャッフル</button>
        <button id="createRoomBtn" class="primary-btn no-top-margin" type="button" disabled>この4人で卓を作る</button>
      </div>
      <p id="createMessage" class="message" aria-live="polite"></p>
    </section>

    <section id="myRoomsCard" class="card hidden">
      <p class="kicker">MY TABLES</p>
      <h2>あなたの卓</h2>
      <div id="myRooms" class="list"></div>
    </section>

    <section class="card">
      <div class="split-head">
        <div>
          <p class="kicker">MEMBERS</p>
          <h2>登録メンバー</h2>
        </div>
        <span id="memberCount" class="selection-pill">0人</span>
      </div>
      <label class="field"><span>検索</span><input id="memberSearch" type="search" placeholder="名前で検索"></label>
      <div id="allMembers" class="account-member-list"></div>
      <p class="muted">メールアドレスは他のメンバーには表示されません。</p>
    </section>

    <section class="card">
      <p class="kicker">QR JOIN</p>
      <h2>QRから卓を開く</h2>
      <button id="scanQrBtn" class="qr-btn" type="button">QRを読み取る</button>
      <input id="roomCode" maxlength="6" class="hidden">
    </section>
  </main>

  <dialog id="qrDialog" class="app-dialog">
    <div class="dialog-panel">
      <div class="dialog-head">
        <div><p class="kicker">QR JOIN</p><h2>QRコードを読み取る</h2></div>
        <button id="closeQrBtn" class="icon-btn" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="qr-scanner-box">
        <video id="qrVideo" playsinline muted></video>
        <div class="qr-guide" aria-hidden="true"></div>
      </div>
      <p id="qrStatus" class="muted">カメラをQRコードへ向けてください。</p>
      <input id="qrImageInput" class="hidden" type="file" accept="image/*">
      <button id="pickQrImageBtn" class="secondary-btn" type="button">写真からQRを読み取る</button>
    </div>
  </dialog>

  <script type="module" src="./index.js"></script>
</body>
</html>
